<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order and Reserve | Slowfolk Coffee</title>
    <meta name="description" content="Locally sourced Mindanao coffee in Bangcud, Malaybalay City.">

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="logo"><img src="images/logo1.jpg" alt="Slowfolk Coffee logo">Slowfolk Coffee</a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" >Menu</a></li>
                <li><a href="order.html">Order and Reserve</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <form class="order-form" action="https://api.web3forms.com/submit" method ="POST">

            <input type="hidden" name="access_key" value="4f1fb3a9-5d27-4991-941b-31b1b4a7db70">
            <input type="hidden" name="subject" value="Pre-order from Slowfolk Coffee">

            <label for="name">Full Name </label>
            <input type="text" id="full-name" name="name" class="input-forms" required >

            <label for="email">Email</label> 
            <input typ="email" id="email" name="email" class="input-forms" required>

            <label for="drink">Drink</label>
            <select id="drink" name="drink" class="input-forms" required>
                <option value="">Choose a drink</option>
                <option>Iced Caramel Macchiato</option>
                <option>Matcha Tea</option>
                <option>Classic Americano</option>
            </select>

            
            <label for="message">Notes</label>
            <div clas="note-send">
                <textarea id="message" name="message" class="order-notes"></textarea>

                <button type="submit" class="send-btn">Send Pre-Order</button>
            </div>

        </form>
        
    </main>
    
    <footer class="site-footer">

        <div class="left-description">
        <p>© 2026 Slowfolk Coffee</p>
        <p>P-2 Bangcud, Malaybalay City, Bukidnon, 8700</p>
        </div>

        <div class="right-description">
        <p >Email: alvarezmyrcvlademier@gmail.com</p>
        <p >Developed by: Myrc Vlademier O. Alvarez</p>
        </div>

        
    </footer>
</body>
</html>
